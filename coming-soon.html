<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SketchRush | Coming Soon</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Simple Header -->
  <header style="padding: 24px;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="logo"><i class="ph ph-pen-nib logo-icon"></i> SketchRush</a>
      <div style="display: flex; gap: 16px;">
        <button class="icon-btn theme-toggle"><i class="ph ph-moon"></i></button>
        <button class="icon-btn rtl-toggle"><i class="ph ph-arrows-left-right"></i></button>
      </div>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 0;">
    <div class="container text-center" style="max-width: 600px;">
      
      <i class="ph ph-hourglass-high" style="font-size: 4rem; color: var(--accent); margin-bottom: 24px; display: inline-block; animation: spin 4s linear infinite;"></i>
      <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>

      <h1 style="font-size: 3rem; margin-bottom: 16px;">Something artistic is coming.</h1>
      <p style="color: var(--text-muted); font-size: 1.125rem; margin-bottom: 40px;">We're sketching out the final details. We'll be launching very soon. Enter your email below to get notified when we go live.</p>

      <!-- Countdown -->
      <div style="display: flex; justify-content: center; gap: 16px; margin-bottom: 40px;">
        <div style="border: 2px solid var(--border); padding: 16px 24px; border-radius: var(--radius); background: var(--surface);">
          <h2 style="font-size: 2.5rem; color: var(--accent);">14</h2>
          <p style="font-size: 0.875rem; text-transform: uppercase; letter-spacing: 1px;">Days</p>
        </div>
        <div style="border: 2px solid var(--border); padding: 16px 24px; border-radius: var(--radius); background: var(--surface);">
          <h2 style="font-size: 2.5rem; color: var(--accent);">08</h2>
          <p style="font-size: 0.875rem; text-transform: uppercase; letter-spacing: 1px;">Hours</p>
        </div>
        <div style="border: 2px solid var(--border); padding: 16px 24px; border-radius: var(--radius); background: var(--surface);">
          <h2 style="font-size: 2.5rem; color: var(--accent);">45</h2>
          <p style="font-size: 0.875rem; text-transform: uppercase; letter-spacing: 1px;">Mins</p>
        </div>
      </div>

      <!-- Newsletter Form -->
      <form action="#" method="POST" style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;" novalidate>
        <input type="email" placeholder="Enter your email" class="form-control" style="max-width: 300px; flex: 1;" required>
        <button type="submit" class="btn btn-primary">Notify Me</button>
      </form>
      <!-- Mailchimp Embed Code Comment -->
      <!-- <form action="YOUR_MAILCHIMP_URL" method="post" id="mc-embedded-subscribe-form" ...> -->
      
    </div>
  </main>

  <!-- Simple Footer -->
  <footer style="padding: 24px; text-align: center; border-top: 1px solid var(--border);">
    <p style="color: var(--text-muted);">&copy; 2026 SketchRush. All rights reserved.</p>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/booking.js"></script>
</body>
</html>
