<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>SketchRush Favicon</title>
  <desc>SketchRush pen nib favicon</desc>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#E8420A"/>

  <!-- Nib body (white, centered) -->
  <polygon points="16,4 23,20 16,27 9,20" fill="white"/>

  <!-- Center slit -->
  <rect x="14.8" y="10" width="2.4" height="12" rx="1" fill="#E8420A" opacity="0.9"/>

  <!-- Tip vent -->
  <polygon points="11.5,21.5 16,27 20.5,21.5" fill="#E8420A" opacity="0.9"/>

  <!-- Gesture curl off tip -->
  <path d="M16,28 C18,30 24,29 27,25"
        fill="none" stroke="white" stroke-width="1.8"
        stroke-linecap="round"/>

</svg>
